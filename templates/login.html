{% extends "base.html" %}
{% block title %}Log In | Password Security System{% endblock %}
{% block content %}
<section class="auth-card">
    <h2>Welcome back</h2>
    <p class="muted">Log in with your username or email address.</p>
    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username or email</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Log in securely</button>
    </form>
    <p class="switch-link">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
